<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C2833;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
.content {
  width: 600pt;
  text-align: center;
}
.title-box {
  background: rgba(255, 255, 255, 0.1);
  padding: 30pt;
  border-radius: 12pt;
  border: 3pt solid #1ABC9C;
  margin-bottom: 30pt;
}
.title-box h2 {
  font-size: 36pt;
  font-weight: bold;
  color: #1ABC9C;
  margin: 0;
  line-height: 1.3;
}
.summary-box {
  background: #ffffff;
  padding: 25pt;
  border-radius: 8pt;
}
.summary-box ul {
  margin: 0;
  padding-left: 30pt;
  text-align: left;
}
.summary-box li {
  font-size: 16pt;
  color: #2C3E50;
  margin: 12pt 0;
  line-height: 1.5;
}
.summary-box li strong {
  color: #1ABC9C;
}
</style>
</head>
<body>
<div class="content">
  <div class="title-box">
    <h2>MCP + Skills + Cowork = 企業級 AI 架構</h2>
  </div>
  <div class="summary-box">
    <ul>
      <li><strong>MCP</strong> 提供標準化介面</li>
      <li><strong>Skills</strong> 提供可重用能力</li>
      <li><strong>Cowork</strong> 實現智慧協作</li>
      <li>三者結合構建可擴展、可治理的企業級 AI 系統</li>
    </ul>
  </div>
</div>
</body>
</html>
