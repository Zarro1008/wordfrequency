<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ECF0F1;
  font-family: Arial, sans-serif;
  display: flex;
}
.header-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 720pt;
  height: 60pt;
  background: #1C2833;
}
.header-content {
  position: absolute;
  top: 15pt;
  left: 40pt;
}
.header-content h2 {
  font-size: 32pt;
  font-weight: bold;
  color: #ffffff;
  margin: 0;
}
.content {
  margin-top: 80pt;
  margin-left: 40pt;
  margin-right: 40pt;
  width: 640pt;
}
.section-title {
  background: #9B59B6;
  padding: 15pt 20pt;
  border-radius: 8pt;
  margin-bottom: 20pt;
}
.section-title h3 {
  font-size: 20pt;
  font-weight: bold;
  color: #ffffff;
  margin: 0;
}
.example-card {
  background: #ffffff;
  padding: 20pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
  border-left: 6pt solid #9B59B6;
}
.example-card h4 {
  font-size: 18pt;
  font-weight: bold;
  color: #9B59B6;
  margin: 0 0 10pt 0;
}
.example-card p {
  font-size: 14pt;
  color: #2C3E50;
  margin: 0;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="header-bar"></div>
<div class="header-content">
  <h2>Skills 範例：專利分析應用</h2>
</div>
<div class="content">
  <div class="section-title">
    <h3>專利分析 Skills</h3>
  </div>
  <div class="example-card">
    <h4>PatentClusteringSkill</h4>
    <p>依 IPC/CPC 或 embedding 進行分群</p>
  </div>
  <div class="example-card">
    <h4>CitationBurstDetectionSkill</h4>
    <p>偵測突發引用技術</p>
  </div>
  <div class="example-card">
    <h4>TechnologyTrendNarrativeSkill</h4>
    <p>將分析結果轉為政策／產業敘事</p>
  </div>
</div>
</body>
</html>
