<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ECF0F1;
  font-family: Arial, sans-serif;
  display: flex;
}
.header-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 720pt;
  height: 60pt;
  background: #1C2833;
}
.header-content {
  position: absolute;
  top: 15pt;
  left: 40pt;
}
.header-content h2 {
  font-size: 32pt;
  font-weight: bold;
  color: #ffffff;
  margin: 0;
}
.content {
  margin-top: 80pt;
  margin-left: 40pt;
  margin-right: 40pt;
  width: 640pt;
}
.section-title {
  background: #F39C12;
  padding: 15pt 20pt;
  border-radius: 8pt;
  margin-bottom: 20pt;
}
.section-title h3 {
  font-size: 20pt;
  font-weight: bold;
  color: #ffffff;
  margin: 0;
}
.workflow {
  background: #ffffff;
  padding: 25pt;
  border-radius: 8pt;
}
.workflow ol {
  margin: 0;
  padding-left: 25pt;
}
.workflow li {
  font-size: 15pt;
  color: #2C3E50;
  margin: 12pt 0;
  line-height: 1.5;
}
.workflow li strong {
  color: #F39C12;
}
</style>
</head>
<body>
<div class="header-bar"></div>
<div class="header-content">
  <h2>技術趨勢分析：Cowork 流程示範</h2>
</div>
<div class="content">
  <div class="section-title">
    <h3>完整協作流程</h3>
  </div>
  <div class="workflow">
    <ol>
      <li><strong>Planner Agent：</strong>定義分析目標（技術趨勢）</li>
      <li><strong>Research Agent：</strong>透過 MCP 擷取專利與新聞</li>
      <li><strong>Analysis Agent：</strong>呼叫多個 Skills 進行網絡分析</li>
      <li><strong>Reviewer Agent：</strong>檢查方法與結論合理性</li>
      <li><strong>Writer Agent：</strong>產出簡報</li>
    </ol>
  </div>
</div>
</body>
</html>
