<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ECF0F1;
  font-family: Arial, sans-serif;
  display: flex;
}
.header-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 720pt;
  height: 60pt;
  background: #1C2833;
}
.header-content {
  position: absolute;
  top: 15pt;
  left: 40pt;
}
.header-content h2 {
  font-size: 32pt;
  font-weight: bold;
  color: #ffffff;
  margin: 0;
}
.content {
  margin-top: 80pt;
  margin-left: 40pt;
  margin-right: 40pt;
  width: 640pt;
}
.section-title {
  background: #9B59B6;
  padding: 15pt 20pt;
  border-radius: 8pt;
  margin-bottom: 20pt;
}
.section-title h3 {
  font-size: 20pt;
  font-weight: bold;
  color: #ffffff;
  margin: 0;
}
.info-box {
  background: #ffffff;
  padding: 20pt;
  border-radius: 8pt;
  border-left: 6pt solid #1ABC9C;
  margin-bottom: 15pt;
}
.info-box p {
  font-size: 16pt;
  color: #2C3E50;
  margin: 0 0 10pt 0;
  line-height: 1.5;
}
.info-box p:last-child {
  margin-bottom: 0;
}
.features {
  background: #ffffff;
  padding: 20pt;
  border-radius: 8pt;
  margin-bottom: 15pt;
}
.features ul {
  margin: 0;
  padding-left: 25pt;
}
.features li {
  font-size: 15pt;
  color: #2C3E50;
  margin: 8pt 0;
  line-height: 1.4;
}
.highlight {
  background: #9B59B6;
  padding: 15pt 20pt;
  border-radius: 8pt;
}
.highlight p {
  font-size: 16pt;
  font-weight: bold;
  color: #ffffff;
  margin: 0;
}
</style>
</head>
<body>
<div class="header-bar"></div>
<div class="header-content">
  <h2>Skills（技能模組）</h2>
</div>
<div class="content">
  <div class="section-title">
    <h3>概念說明</h3>
  </div>
  <div class="info-box">
    <p><b>定義：</b>可被 Agent 呼叫的原子級或組合級能力</p>
  </div>
  <div class="features">
    <p style="font-size: 16pt; font-weight: bold; color: #2C3E50; margin: 0 0 10pt 0;"><b>特性：</b></p>
    <ul>
      <li>明確輸入／輸出</li>
      <li>可測試</li>
      <li>可重用</li>
      <li>可被編排（orchestration）</li>
    </ul>
  </div>
  <div class="highlight">
    <p>核心意義：Agent「能做什麼」的具體體現</p>
  </div>
</div>
</body>
</html>
