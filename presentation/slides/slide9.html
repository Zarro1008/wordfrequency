<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 12pt;
  background: #FF6B9D;
}
.content {
  flex: 1;
  padding: 40pt 50pt;
}
h1 {
  font-size: 36pt;
  font-weight: bold;
  color: #2C3E50;
  margin: 0 0 25pt 0;
}
.tech-section {
  margin: 20pt 0;
}
.section-title {
  font-size: 18pt;
  font-weight: bold;
  color: #16A085;
  margin: 0 0 10pt 0;
}
.tech-list {
  font-size: 14pt;
  color: #2D3748;
  margin: 0;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>技術棧建議</h1>

  <div class="tech-section">
    <p class="section-title">Agent 框架</p>
    <p class="tech-list">LangGraph / AutoGen / CrewAI</p>
  </div>

  <div class="tech-section">
    <p class="section-title">MCP 實現</p>
    <p class="tech-list">Anthropic MCP SDK</p>
  </div>

  <div class="tech-section">
    <p class="section-title">Skills 封裝</p>
    <p class="tech-list">Python (FastAPI) + Node.js</p>
  </div>

  <div class="tech-section">
    <p class="section-title">NLP 與分析</p>
    <p class="tech-list">multilingual-e5-large, GPT-4, scikit-learn, NetworkX</p>
  </div>

  <div class="tech-section">
    <p class="section-title">數據與基礎設施</p>
    <p class="tech-list">PostgreSQL, Neo4j, RabbitMQ / Kafka, Docker, Kubernetes</p>
  </div>

  <div class="tech-section">
    <p class="section-title">可視化</p>
    <p class="tech-list">Plotly, D3.js, pptx skill</p>
  </div>
</div>
</body>
</html>
