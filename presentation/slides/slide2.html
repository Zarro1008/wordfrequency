<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 12pt;
  background: #16A085;
}
.content {
  flex: 1;
  padding: 40pt 50pt;
}
h1 {
  font-size: 36pt;
  font-weight: bold;
  color: #2C3E50;
  margin: 0 0 30pt 0;
}
h2 {
  font-size: 22pt;
  font-weight: bold;
  color: #16A085;
  margin: 25pt 0 15pt 0;
}
p {
  font-size: 16pt;
  color: #2D3748;
  line-height: 1.5;
  margin: 8pt 0;
}
ul {
  margin: 10pt 0 0 20pt;
  padding: 0;
}
li {
  font-size: 15pt;
  color: #2D3748;
  line-height: 1.6;
  margin: 8pt 0;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>系統概述</h1>

  <h2>核心目標</h2>
  <ul>
    <li>專利技術趨勢分析 - 識別技術演進軌跡</li>
    <li>學術前沿追蹤 - 預測研究熱點</li>
    <li>政策決策支援 - 結合 GRB 數據提供建議</li>
    <li>知識圖譜構建 - 跨領域技術關聯</li>
  </ul>

  <h2>設計原則</h2>
  <ul>
    <li>模組化解耦 - MCP 統一數據，Skills 原子化</li>
    <li>可擴展性 - Agent 與 Skills 可動態增減</li>
    <li>可審計性 - 決策過程可追溯</li>
  </ul>
</div>
</body>
</html>
