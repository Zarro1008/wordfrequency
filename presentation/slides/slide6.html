<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 12pt;
  background: #16A085;
}
.content {
  flex: 1;
  padding: 40pt 50pt;
}
h1 {
  font-size: 36pt;
  font-weight: bold;
  color: #2C3E50;
  margin: 0 0 25pt 0;
}
.intro {
  font-size: 16pt;
  color: #2D3748;
  margin: 0 0 25pt 0;
}
.workflow {
  background: #F7F9FC;
  padding: 20pt;
  border-radius: 8pt;
  margin: 0 0 20pt 0;
  text-align: center;
}
.workflow-text {
  font-size: 18pt;
  color: #2C3E50;
  font-weight: bold;
  margin: 0;
}
h2 {
  font-size: 22pt;
  font-weight: bold;
  color: #2C3E50;
  margin: 25pt 0 15pt 0;
}
ul {
  margin: 0 0 0 20pt;
  padding: 0;
}
li {
  font-size: 15pt;
  color: #2D3748;
  line-height: 1.6;
  margin: 6pt 0;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>Cowork Layer 協作層</h1>

  <p class="intro">多 Agent 角色分工與協作機制</p>

  <div class="workflow">
    <p class="workflow-text">Planner → Research → Analysis → Reviewer → Writer</p>
  </div>

  <h2>協作特點</h2>
  <ul>
    <li>基於消息傳遞的非同步通信</li>
    <li>任務分解與依賴管理</li>
    <li>質量控制與迭代優化</li>
    <li>可追溯的決策過程</li>
    <li>Agent 間協商與反饋機制</li>
  </ul>
</div>
</body>
</html>
