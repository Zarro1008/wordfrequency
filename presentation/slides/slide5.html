<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 12pt;
  background: #FF6B9D;
}
.content {
  flex: 1;
  padding: 40pt 50pt;
}
h1 {
  font-size: 36pt;
  font-weight: bold;
  color: #2C3E50;
  margin: 0 0 25pt 0;
}
.intro {
  font-size: 16pt;
  color: #2D3748;
  margin: 0 0 25pt 0;
}
.skill-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 15pt;
  margin: 0;
}
.skill-card {
  background: #F7F9FC;
  padding: 15pt;
  border-radius: 6pt;
  border-left: 5pt solid #16A085;
  width: 280pt;
}
.skill-name {
  font-size: 16pt;
  font-weight: bold;
  color: #2C3E50;
  margin: 0 0 8pt 0;
}
.skill-desc {
  font-size: 13pt;
  color: #555555;
  margin: 0;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <h1>Skills Layer 技能層</h1>

  <p class="intro">可重用、可測試、可編排的原子級與組合級能力</p>

  <div class="skill-grid">
    <div class="skill-card">
      <p class="skill-name">PatentClusteringSkill</p>
      <p class="skill-desc">專利技術聚類分析</p>
    </div>

    <div class="skill-card">
      <p class="skill-name">CitationBurstDetectionSkill</p>
      <p class="skill-desc">突發引用技術檢測</p>
    </div>

    <div class="skill-card">
      <p class="skill-name">TrendForecastingSkill</p>
      <p class="skill-desc">技術趨勢預測</p>
    </div>

    <div class="skill-card">
      <p class="skill-name">CrossDomainMappingSkill</p>
      <p class="skill-desc">跨領域技術關聯分析</p>
    </div>

    <div class="skill-card">
      <p class="skill-name">WordFrequencySkill</p>
      <p class="skill-desc">詞頻與共現網絡分析</p>
    </div>

    <div class="skill-card">
      <p class="skill-name">BiasDetectionSkill</p>
      <p class="skill-desc">數據偏差檢測</p>
    </div>
  </div>
</div>
</body>
</html>
